<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>First Moments - オフライン</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f5f5f5;
      color: #333;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 500px;
    }

    h1 {
      color: #4DBA87;
      margin-bottom: 1rem;
    }

    p {
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .button {
      background-color: #4DBA87;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .button:hover {
      background-color: #3a9d6e;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="icon">📶</div>
    <h1>インターネット接続がありません</h1>
    <p>現在オフラインモードです。インターネット接続を確認して、再度お試しください。</p>
    <p>一部の機能はオフラインでも利用できますが、新しいデータの同期には接続が必要です。</p>
    <button class="button" onclick="window.location.reload()">再読み込み</button>
  </div>
</body>

</html>
